# Workflow de deploy da aplicação Mãos do Vale no GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar arquivos para produção
        run: |
          rm -rf _site
          mkdir -p _site

          cp html/index.html _site/index.html
          cp -r css _site/css
          cp -r imagens _site/imagens
          cp -r js _site/js

          sed -i \
            -e 's#\.\./css/#css/#g' \
            -e 's#\.\./js/#js/#g' \
            -e 's#\.\./imagens/#imagens/#g' \
            _site/index.html _site/js/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
