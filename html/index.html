<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mãos do Vale - organização dedicada a iniciativas sociais, voluntariado e solidariedade.">
    <title>Mãos do Vale | Início</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">

        <div class="container header-content">

            <a class="logo" href="#inicio" data-route="inicio">
                Mãos do Vale
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="menu-principal">
                ☰
                <span>Menu</span>
            </button>

            <nav class="main-nav" aria-label="Navegação principal">

                <ul class="nav-list" id="menu-principal">

                    <li>
                        <a
                            href="#inicio"
                            data-route="inicio">
                            Início
                        </a>
                    </li>

                    <li class="dropdown">

                        <button
                            class="dropdown-toggle"
                            type="button"
                            aria-expanded="false">
                            Projetos
                        </button>

                        <ul class="dropdown-menu">

                            <li>
                                <a
                                    href="#projetos"
                                    data-route="projetos">
                                    Projetos sociais
                                </a>
                            </li>

                            <li>
                                <a
                                    href="#projetos"
                                    data-route="projetos">
                                    Voluntariado
                                </a>
                            </li>

                            <li>
                                <a
                                    href="#projetos"
                                    data-route="projetos">
                                    Doações
                                </a>
                            </li>

                        </ul>

                    </li>

                    <li>
                        <a
                            href="#cadastro"
                            data-route="cadastro">
                            Cadastro
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main class="container">

        <div
            id="app"
            class="grid-layout"
            aria-live="polite">
        </div>

    </main>

    <footer>
        <p>
            &copy; 2026 Mãos do Vale. Projeto acadêmico.
        </p>
    </footer>

    <script src="../js/script.js" defer></script>
    <script src="../js/app.js" defer></script>

</body>
</html>
