<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de voluntários da Mãos do Vale.">
    <title>Mãos do Vale | Cadastro</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">

        <div class="container header-content">

            <a class="logo" href="index.html">
                Mãos do Vale
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="menu-principal">
                ☰
                <span>Menu</span>
            </button>

            <nav class="main-nav" aria-label="Navegação principal">

                <ul class="nav-list" id="menu-principal">

                    <li>
                        <a href="index.html">Início</a>
                    </li>

                    <li class="dropdown">

                        <button
                            class="dropdown-toggle"
                            type="button"
                            aria-expanded="false">
                            Projetos
                        </button>

                        <ul class="dropdown-menu">

                            <li>
                                <a href="projetos.html">
                                    Projetos sociais
                                </a>
                            </li>

                            <li>
                                <a href="projetos.html#voluntariado">
                                    Voluntariado
                                </a>
                            </li>

                            <li>
                                <a href="projetos.html#doacoes">
                                    Doações
                                </a>
                            </li>

                        </ul>

                    </li>

                    <li>
                        <a href="cadastro.html">
                            Cadastro
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main class="container">

        <div class="grid-layout">

            <section class="col-12" aria-labelledby="titulo-cadastro">

                <h1 id="titulo-cadastro">
                    Cadastro de voluntários
                </h1>

                <p>
                    Preencha seus dados para participar das iniciativas
                    da Mãos do Vale.
                </p>

            </section>

            <form
                class="col-12"
                action="#"
                method="post">

                <div class="grid-layout">

                    <fieldset class="col-6">

                        <legend>Dados pessoais</legend>

                        <label for="nome">
                            Nome completo:
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            required
                        >

                        <br><br>

                        <label for="cpf">
                            CPF:
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            inputmode="numeric"
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                            maxlength="14"
                            autocomplete="off"
                            required
                        >

                        <br><br>

                        <label for="email">
                            E-mail:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >

                        <br><br>

                        <label for="nascimento">
                            Data de nascimento:
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                            name="nascimento"
                            autocomplete="bday"
                            required
                        >

                        <br><br>

                        <label for="telefone">
                            Telefone:
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            inputmode="numeric"
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            maxlength="15"
                            autocomplete="tel"
                            required
                        >

                    </fieldset>

                    <fieldset class="col-6">

                        <legend>Endereço</legend>

                        <label for="cep">
                            CEP:
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="00000-000"
                            inputmode="numeric"
                            pattern="[0-9]{5}-[0-9]{3}"
                            maxlength="9"
                            autocomplete="postal-code"
                            required
                        >

                        <br><br>

                        <label for="endereco">
                            Endereço:
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            autocomplete="street-address"
                            required
                        >

                        <br><br>

                        <label for="numero">
                            Número:
                        </label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            autocomplete="address-line1"
                            required
                        >

                        <br><br>

                        <label for="cidade">
                            Cidade:
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            autocomplete="address-level2"
                            required
                        >

                        <br><br>

                        <label for="estado">
                            Estado:
                        </label>

                        <select
                            id="estado"
                            name="estado"
                            autocomplete="address-level1"
                            required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>

                        </select>

                    </fieldset>

                    <div class="col-12">

                        <button type="submit">
                            Enviar cadastro
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </main>

    <footer>
        <p>
            &copy; 2026 Mãos do Vale. Projeto acadêmico.
        </p>
    </footer>

    <script src="../js/script.js" defer></script>

</body>
</html>
